services:
  mosquitto:
    container_name: mosquitto
    hostname: mosquitto
    image: eclipse-mosquitto
    volumes:
      - <config-path>:/mosquitto/config
      - <data-path>:/mosquitto/data
      - <log-path>:/mosquitto/log
#   ports:
#     - 1883:1883
#     - 9001:9001
    tty: true
    stdin_open: true
    restart: unless-stopped
    networks:
      - prod

networks:
  prod:
    name: prod
    external: true
