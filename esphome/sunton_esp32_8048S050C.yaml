# --- GENERAL ---
esphome:
  name: display
  friendly_name: Display
  on_boot:
    - lvgl.slider.update:
        id: backlight_slider
        value: 203
    - light.turn_on:
        id: backlight
        brightness: 0.8
    - delay: 60s
    - lvgl.widget.hide: boot_screen

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  cpu_frequency: 240MHZ
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz

api:
  encryption:
    key: !secret sunton_api_encryption_key

  on_client_connected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.label.update:
              id: homeassistant_status_label
              text: "Connected"

  on_client_disconnected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.label.update:
              id: homeassistant_status_label
              text: "Disconnected"

ota:
  - platform: esphome
    password: !secret sunton_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "HAdisplay Fallback Hotspot"
    password: !secret ap_password

web_server:
  port: 80

captive_portal:

# --- LOGGING ---
logger:
  level: DEBUG

debug:
  update_interval: 5s

#sensor:
#  - platform: debug
#    free:
#      name: "Heap Free"
#    block:
#      name: "Heap Max Block"
#    loop_time:
#      name: "Loop Time"
#    psram:
#      name: "Free PSRAM"
#    cpu_frequency:
#      name: "CPU Frequency"

# --- IMAGES ---
image:
  - file: https://esphome.io/_static/favicon-512x512.png
    id: esphome_logo
    type: RGB565
    resize: 200x200
    transparency: alpha_channel

# --- TIME ---
time:
  - platform: homeassistant
    id: homeassistant_time
    on_time:
      - minutes: '*'
        seconds: 0
        then:
          - script.execute: time_update
      - hours: 3,4,5
        minutes: 5
        seconds: 0
        then:
          - switch.turn_on: antiburnin_switch
      - hours: 3,4,5
        minutes: 35
        seconds: 0
        then:
          - switch.turn_off: antiburnin_switch

# --- SCRIPTS ---
script:
  - id: time_update
    then:
      - lvgl.label.update:
          id: homeassistant_time_label
          text: !lambda |-
            char buf[6];
            auto now = id(homeassistant_time).now();
            snprintf(buf, sizeof(buf), "%02d:%02d", now.hour, now.minute);
            return buf;

# --- NUMBERS ---
number:
  - platform: template
    id: display_timeout
    name: "LVGL Screen timeout"
    optimistic: true
    unit_of_measurement: "s"
    initial_value: 90
    restore_value: true
    min_value: 10
    max_value: 180
    step: 5
    mode: box

# --- SENSORS ---
binary_sensor:
  - platform: status
    id: system_status
    name: "ESPHome status"

text_sensor:
  - platform: debug
    device:
      name: "Device Info"
    reset_reason:
      name: "Reset Reason"

sensor:
  - platform: homeassistant
    id: indoor_temp
    name: "Indoor Temperature"
    entity_id: sensor.indoor_temperature
    on_value:
      - lvgl.indicator.update:
          id: indoor_temp_needle
          value: !lambda return x * 10;
      - lvgl.label.update:
          id: indoor_temp_text
          text:
            format: "%.1f°C"
            args: [ 'x' ]

  - platform: homeassistant
    id: outdoor_temp
    name: "Outdoor Temperature"
    entity_id: sensor.outdoor_temperature
    on_value:
      - lvgl.indicator.update:
          id: outdoor_temp_needle
          value: !lambda return x * 10;
      - lvgl.label.update:
          id: outdoor_temp_text
          text:
            format: "%.1f°C"
            args: [ 'x' ]

  - platform: homeassistant
    id: indoor_hum
    name: "Indoor Humidity"
    entity_id: sensor.indoor_humidity
    on_value:
      - lvgl.indicator.update:
          id: indoor_hum_needle
          value: !lambda return x * 10;
      - lvgl.label.update:
          id: indoor_hum_text
          text:
            format: "%.1f%%"
            args: [ 'x' ]

  - platform: homeassistant
    id: outdoor_hum
    name: "Outdoor Humidity"
    entity_id: sensor.outdoor_humidity
    on_value:
      - lvgl.indicator.update:
          id: outdoor_hum_needle
          value: !lambda return x * 10;
      - lvgl.label.update:
          id: outdoor_hum_text
          text:
            format: "%.1f%%"
            args: [ 'x' ]

  - platform: homeassistant
    id: left_wled_brightness
    name: "Left WLED brightness"
    entity_id: light.left_wled
    attribute: brightness
    filters:
      - filter_out: NAN
    on_value:
      - lvgl.slider.update:
          id: left_wled_slider
          value: !lambda 'return x;'

  - platform: homeassistant
    id: right_wled_brightness
    name: "Right WLED brightness"
    entity_id: light.right_wled
    attribute: brightness
    filters:
      - filter_out: NAN
    on_value:
      - lvgl.slider.update:
          id: right_wled_slider
          value: !lambda 'return x;'

  - platform: homeassistant
    id: monitor_wled_brightness
    name: "Monitor WLED brightness"
    entity_id: light.monitor_wled
    attribute: brightness
    filters:
      - filter_out: NAN
    on_value:
      - lvgl.slider.update:
          id: monitor_wled_slider
          value: !lambda 'return x;'

  - platform: homeassistant
    id: backlight_brightness
    entity_id: light.display_backlight
    attribute: brightness
    on_value:
      - lvgl.slider.update:
          id: backlight_slider
          value: !lambda return x;

# --- BUTTONS ---
button:
  - platform: restart
    id: restart_button
    name: "ESPHome Display Restart"

# --- SWITCHES ---
switch:
  - platform: homeassistant
    id: main_light
    name: "Main Light switch"
    entity_id: switch.main_light_switch
    on_turn_on:
      - lvgl.widget.update:
          id: main_light_switch
          state:
            checked: True
    on_turn_off:
      - lvgl.widget.update:
          id: main_light_switch
          state:
            checked: False

  - platform: homeassistant
    id: left_light
    name: "Left Light switch"
    entity_id: switch.left_light_switch
    on_turn_on:
      - lvgl.widget.update:
          id: left_light_switch
          state:
            checked: True
    on_turn_off:
      - lvgl.widget.update:
          id: left_light_switch
          state:
            checked: False

  - platform: homeassistant
    id: right_light
    name: "Right Light switch"
    entity_id: switch.right_light_switch
    on_turn_on:
      - lvgl.widget.update:
          id: right_light_switch
          state:
            checked: True
    on_turn_off:
      - lvgl.widget.update:
          id: right_light_switch
          state:
            checked: False

  - platform: template
    id: antiburnin_switch
    name: "Anti-burnin"
    icon: mdi:television-shimmer
    optimistic: true
    entity_category: "config"
    turn_on_action:
      - logger.log: "Starting Anti-burnin"
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
      - lvgl.pause:
          show_snow: true
    turn_off_action:
      - logger.log: "Stopping Anti-burnin"
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
      #- if:
      #    condition:
      #      - light.is_off: backlight
      #    then:
      #      - lvgl.pause:

# --- BACKLIGHT ---
output:
  - platform: ledc
    id: gpio_backlight_pwm
    pin: 2
    frequency: 1220
    min_power: 0.15
    max_power: 1.0
    zero_means_zero: True

light:
  - platform: monochromatic
    id: backlight
    name: "Display Backlight"
    output: gpio_backlight_pwm
    restore_mode: ALWAYS_OFF

# --- DISPLAY ---
display:
  - platform: rpi_dpi_rgb
    id: main_display
    color_order: RGB
    update_interval: never
    auto_clear_enabled: False
    dimensions:
      width: 800
      height: 480
    de_pin: 40
    hsync_pin: 39
    vsync_pin: 41
    pclk_pin: 42
    data_pins:
      red:    [45, 48, 47, 21, 14]
      green:  [5, 6, 7, 15, 16, 4]
      blue:   [8, 3, 46, 9, 1]
    #pclk_frequency: 12.5MHz
    #show_test_card: True

# --- TOUCHSCREEN ---
i2c:
  sda: 19
  scl: 20
  scan: True

touchscreen:
  - platform: gt911
    id: main_touchscreen
    address: 0x5D
    update_interval: 16ms
    transform:
      swap_xy: False
      mirror_y: False
    on_release:
      - if:
          condition: lvgl.is_paused
          then:
            - logger.log: "LVGL resuming"
            - lvgl.resume:
            - lvgl.widget.redraw:
      - if:
          condition:
            - switch.is_on: antiburnin_switch
          then:
            - switch.turn_off: antiburnin_switch
      - if:
          condition:
            - light.is_off: backlight
          then:
            - light.turn_on: backlight
    #on_touch:
    #  - lambda: |-
    #      ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
    #        touch.x,
    #        touch.y,
    #        touch.x_raw,
    #        touch.y_raw
    #      );

# --- WIDGETS ---
lvgl:
  displays:
    - main_display

  touchscreens:
    - main_touchscreen

  on_idle:
    timeout: !lambda "return (id(display_timeout).state * 1000);"
    then:
      - logger.log: "LVGL is idle"
      - light.turn_off: backlight
      - lvgl.pause:

  default_font: montserrat_22

  theme:
    switch:
      bg_color: 0xC0C0C0
      bg_grad_color: 0xb0b0b0
      bg_grad_dir: VER
      bg_opa: COVER
      width: 80
      height: 45
      disabled:
        bg_color: 0x888888
      checked:
        bg_color: 0x1d5f96
        bg_grad_color: 0x03324A
      knob:
        bg_color: 0xFFFFFF
        bg_grad_color: 0xC0C0C0

    button:
      main:
        width: 150
        height: 50
      pressed:
        bg_color: 0xAAAAAA

    slider:
      main:
        width: 25
        height: 170

  top_layer:
    widgets:
      - obj:
          id: boot_screen
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_color: 0xffffff
          bg_opa: COVER
          radius: 0
          pad_all: 0
          border_width: 0
          widgets:
            - image:
                align: CENTER
                src: esphome_logo
                y: -40
            - spinner:
                align: CENTER
                y: 95
                height: 50
                width: 50
                spin_time: 1s
                arc_length: 60deg
                arc_width: 8
                indicator:
                  arc_color: 0x18bcf2
                  arc_width: 8
          on_press:
            - lvgl.widget.hide: boot_screen

  pages:
    - id: main_page
      # on_swipe_left:
      #   - logger.log: "Swiped left"
      # on_swipe_right:
      #   - logger.log: "Swiped right"
      widgets:
        - tabview:
            id: lighting_tabs
            position: TOP
            size: 10%
            tab_style:
              items:
                text_font: montserrat_20
            tabs:
              - name: "Lights"
                id: lights_tab
                widgets:
                  - obj:
                      align: BOTTOM_MID
                      width: 600
                      height: 420
                      pad_all: 8
                      pad_top: 40
                      bg_opa: TRANSP
                      border_opa: TRANSP
                      layout:
                        type: GRID
                        grid_columns: [ FR(1), FR(1), FR(1) ]
                        grid_rows: [ FR(10), FR(20), FR(3), FR(10), FR(1), FR(65) ]
                      widgets:
                        - label:
                            text: "Main light"
                            grid_cell_row_pos: 0
                            grid_cell_column_pos: 0
                            grid_cell_x_align: CENTER
                        - switch:
                            id: main_light_switch
                            grid_cell_row_pos: 1
                            grid_cell_column_pos: 0
                            grid_cell_x_align: CENTER
                            on_change:
                              - homeassistant.action:
                                  action: switch.toggle
                                  data:
                                    entity_id: switch.main_light_switch

                        - label:
                            text: "Left light"
                            grid_cell_row_pos: 0
                            grid_cell_column_pos: 1
                            grid_cell_x_align: CENTER
                        - switch:
                            id: left_light_switch
                            grid_cell_row_pos: 1
                            grid_cell_column_pos: 1
                            grid_cell_x_align: CENTER
                            on_change:
                              - homeassistant.action:
                                  action: switch.toggle
                                  data:
                                    entity_id: switch.left_light_switch

                        - label:
                            text: "Right light"
                            grid_cell_row_pos: 0
                            grid_cell_column_pos: 2
                            grid_cell_x_align: CENTER
                        - switch:
                            id: right_light_switch
                            grid_cell_row_pos: 1
                            grid_cell_column_pos: 2
                            grid_cell_x_align: CENTER
                            on_change:
                              - homeassistant.action:
                                  action: switch.toggle
                                  data:
                                    entity_id: switch.right_light_switch

                        - label:
                            text: "Left WLED"
                            grid_cell_row_pos: 3
                            grid_cell_column_pos: 0
                            grid_cell_x_align: CENTER
                        - slider:
                            id: left_wled_slider
                            min_value: 0
                            max_value: 255
                            grid_cell_row_pos: 4
                            grid_cell_column_pos: 0
                            grid_cell_x_align: CENTER
                            # adv_hittest: true
                            on_release:
                              - homeassistant.action:
                                  action: light.turn_on
                                  data:
                                    entity_id: light.left_wled
                                    brightness: !lambda return int(x);

                        - label:
                            text: "Right WLED"
                            grid_cell_row_pos: 3
                            grid_cell_column_pos: 1
                            grid_cell_x_align: CENTER
                        - slider:
                            id: right_wled_slider
                            min_value: 0
                            max_value: 255
                            grid_cell_row_pos: 4
                            grid_cell_column_pos: 1
                            grid_cell_x_align: CENTER
                            # adv_hittest: true
                            on_release:
                              - homeassistant.action:
                                  action: light.turn_on
                                  data:
                                    entity_id: light.right_wled
                                    brightness: !lambda return int(x);

                        - label:
                            text: "Monitor WLED"
                            grid_cell_row_pos: 3
                            grid_cell_column_pos: 2
                            grid_cell_x_align: CENTER
                        - slider:
                            id: monitor_wled_slider
                            min_value: 0
                            max_value: 255
                            grid_cell_row_pos: 4
                            grid_cell_column_pos: 2
                            grid_cell_x_align: CENTER
                            # adv_hittest: true
                            on_release:
                              - homeassistant.action:
                                  action: light.turn_on
                                  data:
                                    entity_id: light.monitor_wled
                                    brightness: !lambda return int(x);

              - name: "Scenes"
                id: scenes_tab
                widgets:
                  - buttonmatrix:
                      id: scene_matrix
                      one_checked: True
                      align: CENTER
                      width: 700
                      height: 370
                      items:
                        pressed:
                          bg_color: 0xFFFF00
                      rows:
                        - buttons:
                            - id: scene_1_btn
                              text: "All on"
                              on_click:
                                - homeassistant.action:
                                    action: scene.turn_on
                                    data:
                                      entity_id: scene.all_lights_on
                            - id: scene_2_btn
                              text: "All off"
                              on_click:
                                - homeassistant.action:
                                    action: scene.turn_on
                                    data:
                                      entity_id: scene.all_lights_off
                            - id: scene_3_btn
                              text: "Well-lit"
                              on_click:
                                - homeassistant.action:
                                    action: scene.turn_on
                                    data:
                                      entity_id: scene.well_lit_lights
                            - id: scene_4_btn
                              text: "Basic"
                              on_click:
                                - homeassistant.action:
                                    action: scene.turn_on
                                    data:
                                      entity_id: scene.basic_lights

                        - buttons:
                            - id: scene_5_btn
                              text: "Northern"
                              on_click:
                                - homeassistant.action:
                                    action: scene.turn_on
                                    data:
                                      entity_id: scene.northern_lights
                            - id: scene_6_btn
                              text: "Lively"
                              on_click:
                                - homeassistant.action:
                                    action: scene.turn_on
                                    data:
                                      entity_id: scene.lively_orange
                            - id: scene_7_btn
                              text: "Red"
                              on_click:
                                - homeassistant.action:
                                    action: scene.turn_on
                                    data:
                                      entity_id: scene.red_lighting
                            - id: scene_8_btn
                              text: "Flash"
                              on_click:
                                - homeassistant.action:
                                    action: scene.turn_on
                                    data:
                                      entity_id: scene.flash_lighting

              - name: "Temperature"
                id: env_tab
                widgets:
                  - obj:
                      align: BOTTOM_MID
                      width: 700
                      height: 370
                      pad_all: 8
                      pad_bottom: 20
                      bg_opa: TRANSP
                      border_opa: TRANSP
                      layout:
                        type: GRID
                        grid_columns: [ FR(1), FR(1) ]
                        grid_rows: [ CONTENT ]
                      widgets:
                        - meter:
                            grid_cell_row_pos: 0
                            grid_cell_column_pos: 0
                            grid_cell_x_align: CENTER
                            height: 300
                            width: 300
                            scales:
                              - range_from: -150    # scale for the needle value
                                range_to: 500
                                angle_range: 240
                                rotation: 150
                                indicators:
                                  - line:
                                      id: indoor_temp_needle
                                      width: 5
                                      color: 0xFF0000
                                      r_mod: -4
                                  - tick_style:
                                      start_value: -15
                                      end_value: 50
                                      color_start: 0x0000bd
                                      color_end: 0xbd0000
                                      width: 1
                              - range_from: -15     # scale for the value labels
                                range_to: 50
                                angle_range: 240
                                rotation: 150
                                ticks:
                                  width: 1
                                  count: 51
                                  length: 10
                                  color: 0x000000
                                  major:
                                    stride: 5
                                    width: 2
                                    length: 10
                                    color: 0x404040
                                    label_gap: 15
                            widgets:
                              - label:
                                  id: indoor_temp_text
                                  text: "-.-°C"
                                  align: CENTER
                                  y: 70
                              - label:
                                  text: "Indoor"
                                  align: CENTER
                                  y: 100
                        - meter:
                            grid_cell_row_pos: 0
                            grid_cell_column_pos: 1
                            grid_cell_x_align: CENTER
                            height: 300
                            width: 300
                            scales:
                              - range_from: -150    # scale for the needle value
                                range_to: 500
                                angle_range: 240
                                rotation: 150
                                indicators:
                                  - line:
                                      id: outdoor_temp_needle
                                      width: 5
                                      color: 0xFF0000
                                      r_mod: -4
                                  - tick_style:
                                      start_value: -15
                                      end_value: 50
                                      color_start: 0x0000bd
                                      color_end: 0xbd0000
                                      width: 1
                              - range_from: -15     # scale for the value labels
                                range_to: 50
                                angle_range: 240
                                rotation: 150
                                ticks:
                                  width: 1
                                  count: 51
                                  length: 10
                                  color: 0x000000
                                  major:
                                    stride: 5
                                    width: 2
                                    length: 10
                                    color: 0x404040
                                    label_gap: 15
                            widgets:
                              - label:
                                  id: outdoor_temp_text
                                  text: "-.-°C"
                                  align: CENTER
                                  y: 70
                              - label:
                                  text: "Outdoor"
                                  align: CENTER
                                  y: 100

              - name: "Humidity"
                id: humidity_tab
                widgets:
                  - obj:
                      align: CENTER
                      width: 700
                      height: 370
                      pad_all: 10
                      #bg_opa: TRANSP
                      #border_opa: TRANSP
                      layout:
                        type: GRID
                        grid_columns: [ FR(1), FR(1) ]
                        grid_rows: [ FR(10), FR(90) ]
                      widgets:
                        - meter:
                            grid_cell_row_pos: 1
                            grid_cell_column_pos: 0
                            grid_cell_x_align: CENTER
                            grid_cell_y_align: CENTER
                            height: 300
                            width: 300
                            border_width: 0
                            bg_opa: TRANSP
                            scales:
                              - range_from: 0
                                range_to: 100
                                angle_range: 180
                                ticks:
                                  count: 100
                                  width: 1
                                  length: 31
                                indicators:
                                  - tick_style:
                                      start_value: 0
                                      end_value: 100
                                      color_start: 0xffcc66
                                      color_end: 0x3399ff
                              - range_from: 0
                                range_to: 1000
                                angle_range: 180
                                ticks:
                                  count: 0
                                indicators:
                                  - line:
                                      id: indoor_hum_needle
                                      width: 4
                                      r_mod: 2
                                      value: 0
                            widgets:
                              - label:
                                  id: indoor_hum_text
                                  text: "--.-%"
                                  align: CENTER
                                  y: 45
                              - label:
                                  text: "Indoor"
                                  align: CENTER
                                  y: 80
                        - meter:
                            grid_cell_row_pos: 1
                            grid_cell_column_pos: 1
                            grid_cell_x_align: CENTER
                            grid_cell_y_align: CENTER
                            height: 300
                            width: 300
                            border_width: 0
                            bg_opa: TRANSP
                            scales:
                              - range_from: 0
                                range_to: 100
                                angle_range: 180
                                ticks:
                                  count: 100
                                  width: 1
                                  length: 31
                                indicators:
                                  - tick_style:
                                      start_value: 0
                                      end_value: 100
                                      color_start: 0xffcc66
                                      color_end: 0x3399ff
                              - range_from: 0
                                range_to: 1000
                                angle_range: 180
                                ticks:
                                  count: 0
                                indicators:
                                  - line:
                                      id: outdoor_hum_needle
                                      width: 4
                                      r_mod: 2
                                      value: 0
                            widgets:
                              - label:
                                  id: outdoor_hum_text
                                  text: "--.-%"
                                  align: CENTER
                                  y: 45
                              - label:
                                  text: "Outdoor"
                                  align: CENTER
                                  y: 80

              - name: "Device"
                id: status_tab
                widgets:
                  - obj:
                      align: CENTER
                      pad_all: 10
                      width: 700
                      height: 370
                      layout:
                        type: GRID
                        grid_columns: [ FR(1), FR(1) ]
                        grid_rows: [ SIZE_CONTENT, SIZE_CONTENT, SIZE_CONTENT, SIZE_CONTENT ]
                      widgets:
                        # Row 0: API status
                        - label:
                            text: "Home Assistant:"
                            grid_cell_row_pos: 0
                            grid_cell_column_pos: 0
                            grid_cell_x_align: END
                            grid_cell_y_align: CENTER
                            pad_right: 5
                        - label:
                            id: homeassistant_status_label
                            text: "Disconnected"
                            grid_cell_row_pos: 0
                            grid_cell_column_pos: 1
                            grid_cell_x_align: START
                            grid_cell_y_align: CENTER
                            pad_left: 5

                        # Row 1: Clock
                        - label:
                            text: "Time:"
                            grid_cell_row_pos: 1
                            grid_cell_column_pos: 0
                            grid_cell_x_align: END
                            grid_cell_y_align: CENTER
                            pad_right: 5
                        - label:
                            id: homeassistant_time_label
                            text: "--:--"
                            grid_cell_row_pos: 1
                            grid_cell_column_pos: 1
                            grid_cell_x_align: START
                            grid_cell_y_align: CENTER
                            pad_left: 5

                        # Row 2: Brightness slider
                        - label:
                            text: "Brightness:"
                            grid_cell_row_pos: 2
                            grid_cell_column_pos: 0
                            grid_cell_x_align: END
                            grid_cell_y_align: CENTER
                            pad_right: 5
                        - slider:
                            id: backlight_slider
                            grid_cell_row_pos: 2
                            grid_cell_column_pos: 1
                            grid_cell_x_align: START
                            grid_cell_y_align: CENTER
                            width: 200
                            height: 20
                            min_value: 1
                            max_value: 255
                            # adv_hittest: true
                            on_release:
                              then:
                                - light.turn_on:
                                    id: backlight
                                    brightness: !lambda 'return x / 255.0;'

                        # Row 3: Restart button
                        - label:
                            text: "Restart:"
                            grid_cell_row_pos: 3
                            grid_cell_column_pos: 0
                            grid_cell_x_align: END
                            grid_cell_y_align: CENTER
                            pad_right: 5
                        - button:
                            grid_cell_row_pos: 3
                            grid_cell_column_pos: 1
                            grid_cell_x_align: START
                            grid_cell_y_align: CENTER
                            widgets:
                              - label:
                                  text: 'Press'
                                  align: CENTER
                            on_click:
                              then:
                                - delay: 1s
                                - button.press: restart_button
